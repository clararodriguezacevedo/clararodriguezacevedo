<svg xmlns="http://www.w3.org/2000/svg" width="473" height="150" viewBox="0 0 473 150" role="img" aria-label="Clara">
<style>text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; white-space: pre; }
  .in { opacity: 0; animation: in .5s cubic-bezier(.2,.7,.2,1) forwards; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .up { opacity: 0; animation: up .45s cubic-bezier(.2,.7,.2,1) forwards; transform-box: fill-box; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .in, .up { animation: none; opacity: 1; } .blink { animation: none; } }</style>
